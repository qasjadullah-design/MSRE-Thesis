# TH-003: does upstream PyPSA-USA build and solve a PJM-only footprint?
#
# Runs on a GitHub-hosted Linux runner because the pinned PyPSA-USA environment
# cannot be imported on the project's Windows workstation (see
# docs/PJM_BASELINE_FEASIBILITY.md, section 5).
#
# This is a feasibility test. A green run shows the pipeline executes for the
# PJM footprint; it does not validate the model against PJM outcomes.

name: TH-003 PJM smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - th-003-pypsa-usa-pjm-feasibility
    paths:
      - "configs/pypsa-usa/**"
      - "tools/summarize_network.py"
      - "tools/ci_annotate_logs.py"
      - ".github/workflows/th003-pjm-smoke.yml"

permissions:
  contents: read

env:
  # Not named PYPSA_*: PyPSA reads every PYPSA_* environment variable as one of its options.
  UPSTREAM_REF: 04a0edd220b1d331715c269a4eab68344c07a088 # v1.0.0
  CONFIG: ${{ github.workspace }}/thesis/configs/pypsa-usa/config.pjm_smoke.yaml
  SOLVED: results/pjm_smoke/eastern/networks/elec_s75_c22_ec_lv1.0_1h_E.nc

defaults:
  run:
    shell: bash # -eo pipefail, so a failure upstream of a pipe fails the step

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out thesis repository
        uses: actions/checkout@v4
        with:
          path: thesis

      - name: Check out PyPSA-USA at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: PyPSA/pypsa-usa
          ref: ${{ env.UPSTREAM_REF }}
          path: pypsa-usa

      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Upstream's cluster-count step solves a small quadratic program with Pyomo.
      # With HiGHS configured it calls the `ipopt` executable, which the uv
      # environment does not provide (upstream's conda environment does).
      - name: Install the Ipopt executable
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq coinor-ipopt || true
          if ! command -v ipopt >/dev/null; then
            curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xj -C "$RUNNER_TEMP" bin/micromamba
            "$RUNNER_TEMP/bin/micromamba" create -y -q -p "$RUNNER_TEMP/ipopt" -c conda-forge ipopt
            echo "$RUNNER_TEMP/ipopt/bin" >> "$GITHUB_PATH"
            export PATH="$RUNNER_TEMP/ipopt/bin:$PATH"
          fi
          command -v ipopt
          ipopt --version

      - name: Install the locked PyPSA-USA environment
        working-directory: pypsa-usa
        run: |
          bash init_pypsa_usa.sh
          uv sync --frozen
          uv run python -c "import sys, pypsa, linopy, snakemake, highspy; print('python', sys.version.split()[0], '| pypsa', pypsa.__version__, '| linopy', linopy.__version__, '| snakemake', snakemake.__version__)"

      - name: Dry run (validates the config and lists the jobs)
        working-directory: pypsa-usa/workflow
        run: uv run snakemake "$SOLVED" -n -j4 --scheduler greedy --configfile "$CONFIG" | tail -n 80

      - name: Build the PJM data model (no solver)
        working-directory: pypsa-usa/workflow
        run: uv run snakemake data_model -j4 --scheduler greedy --configfile "$CONFIG" 2>&1 | tee "$RUNNER_TEMP/console_build.log"

      - name: Solve with HiGHS
        working-directory: pypsa-usa/workflow
        run: uv run snakemake "$SOLVED" -j4 --scheduler greedy --configfile "$CONFIG" 2>&1 | tee "$RUNNER_TEMP/console_solve.log"

      - name: Report log tails as annotations on failure
        if: failure()
        working-directory: pypsa-usa
        run: python3 "$GITHUB_WORKSPACE/thesis/tools/ci_annotate_logs.py" workflow "$RUNNER_TEMP/console_solve.log" "$RUNNER_TEMP/console_build.log"

      - name: Summarise the networks
        if: always()
        working-directory: pypsa-usa
        run: |
          uv run python "$GITHUB_WORKSPACE/thesis/tools/summarize_network.py" workflow > "$RUNNER_TEMP/summary.md" || echo "No network to summarise." >> "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          # Job summaries need a signed-in account; notices are readable from the public API.
          python3 "$GITHUB_WORKSPACE/thesis/tools/ci_annotate_logs.py" --notice "network summary" "$RUNNER_TEMP/summary.md"
          log=$(find workflow/logs -name "*solver.log" | head -n 1)
          if [ -n "$log" ]; then
            tail -c 3000 "$log" > "$RUNNER_TEMP/solver_tail.log"
            python3 "$GITHUB_WORKSPACE/thesis/tools/ci_annotate_logs.py" --notice "solver log tail" "$RUNNER_TEMP/solver_tail.log"
          fi
          df -h /

      - name: Upload logs and networks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: th003-pjm-smoke
          retention-days: 30
          if-no-files-found: warn
          path: |
            pypsa-usa/workflow/logs/
            pypsa-usa/workflow/.snakemake/log/
            pypsa-usa/workflow/results/pjm_smoke/
            pypsa-usa/workflow/resources/pjm_smoke/networks/
